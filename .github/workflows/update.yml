name: Actualiser server.met

on:
  schedule:
    - cron: '0 */6 * * *'  # S'exécute toutes les 6 heures
  workflow_dispatch:       # Permet de lancer manuellement depuis l'interface web

# Autorisations nécessaires pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécuter le script de génération
        run: python main.py

      - name: Préparer l'artefact pour Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public' # Le dossier contenant index.html et server.met

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
